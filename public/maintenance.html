<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Story Living — We'll be right back</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f5f2eb;
      --ink: #2a1f15;
      --teal: #004848;
      --coral: #e87c61;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'Lora', Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      line-height: 1.7;
    }
    .wrap {
      max-width: 560px;
      text-align: center;
    }

    /* Story (Living) wordmark */
    .logo { display: inline-block; margin-bottom: 44px; }
    .word {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: 46px;
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1;
    }
    .word .s { color: #70c5c0; }
    .word .t { color: #2e1507; }
    .word .o { color: #004848; }
    .word .r { color: #a01b25; }
    .word .y { color: #e87c61; }
    .sub {
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--ink);
      margin-top: 6px;
    }

    .eyebrow {
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--coral);
      font-weight: 600;
      margin-bottom: 18px;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--teal);
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    p {
      font-size: 17px;
      color: #4a4036;
    }
    .contact {
      margin-top: 30px;
      font-size: 15px;
    }
    .contact a {
      color: var(--teal);
      text-decoration: underline;
    }
    .contact a:hover { color: var(--coral); }

    @media (max-width: 480px) {
      .word { font-size: 34px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo" aria-label="Story Living">
      <div class="word">
        <span class="s">S</span><span class="t">T</span><span class="o">O</span><span class="r">R</span><span class="y">Y</span>
      </div>
      <div class="sub">(Living)</div>
    </div>

    <div class="eyebrow">We'll be right back</div>
    <h1>Our site is being updated</h1>
    <p>We're making Story Living a little better. The site will be back online shortly — thank you for your patience.</p>

    <p class="contact">
      For enquiries and bookings, email
      <a href="mailto:info.lidingo@storyliving.se">info.lidingo&#64;storyliving.se</a>
    </p>
  </main>
</body>
</html>
